clients:
  - url: http://loki-logs:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
      - multiline:
          firstline: '^\{'
      - labels:
          stream:
          job:

  - job_name: openwebui
    static_configs:
      - targets:
          - localhost
        labels:
          job: openwebui
          __path__: /var/lib/docker/containers/*/*-json.log
    relabel_configs:
      - source_labels: ['__path__']
        regex: '.*(webui-service).*'
        action: keep

  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          __path__: /var/lib/docker/containers/*/*-json.log
    relabel_configs:
      - source_labels: ['__path__']
        regex: '.*(postgres-db).*'
        action: keep

  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/lib/docker/containers/*/*-json.log
    relabel_configs:
      - source_labels: ['__path__']
        regex: '.*(redis-cache).*'
        action: keep
