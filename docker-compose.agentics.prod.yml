name: agentics-prod

networks:
  frontend_net:
    driver: bridge
  model_net:
    driver: bridge
    internal: true
  memory_net:
    driver: bridge
    internal: true
  tools_net:
    driver: bridge
    internal: true
  workflow_net:
    driver: bridge
    internal: true
  monitoring_net:
    driver: bridge
    internal: true

volumes:
  open-webui_data:
  ollama_data:
  postgres_data:
  redis_data:
  chroma_data:
  n8n_data:
  minio_data:
  browser_profile_data:
  python_sandbox_data:
  open_terminal_data:
  prometheus_data:
  grafana_data:
  loki_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

x-secure-defaults: &secure-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-agent-limits: &agent-limits
  mem_limit: 2g
  cpus: "2.0"
  pids_limit: 256

services:
  # =========================================================
  # LOCAL MODEL RUNNER - internal only, no host port
  # =========================================================
  ollama:
    <<: *secure-defaults
    image: ollama/ollama:latest
    container_name: agentics-ollama
    networks:
      - model_net
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # =========================================================
  # DATABASES / MEMORY - internal only
  # =========================================================
  postgres:
    <<: *secure-defaults
    image: postgres:16-alpine
    container_name: agentics-postgres
    networks:
      - memory_net
      - workflow_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    environment:
      - POSTGRES_USER=agentics
      - POSTGRES_DB=openwebui
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentics -d openwebui"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *secure-defaults
    image: redis:7-alpine
    container_name: agentics-redis
    networks:
      - memory_net
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    <<: *secure-defaults
    image: chromadb/chroma:latest
    container_name: agentics-chroma
    networks:
      - memory_net
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  tika:
    <<: *secure-defaults
    image: apache/tika:latest-full
    container_name: agentics-tika
    networks:
      - memory_net

  # =========================================================
  # MAIN UI - only public localhost service by default
  # =========================================================
  open-webui:
    <<: *secure-defaults
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentics-open-webui
    depends_on:
      - ollama
      - postgres
      - redis
      - chroma
      - tika
      - tools-api
      - open-terminal
    networks:
      - frontend_net
      - model_net
      - memory_net
      - tools_net
      - workflow_net
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui_data:/app/backend/data
      - ./agent-workspace:/workspace:rw
    environment:
      - WEBUI_NAME=${WEBUI_NAME:-Agentics Production}
      - WEBUI_URL=${WEBUI_URL:-http://127.0.0.1:3000}

      # local models only
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_OLLAMA_API=true
      - ENABLE_OPENAI_API=false
      - OPENAI_API_KEY=
      - OPENAI_API_BASE_URL=

      # persistence
      - DATABASE_URL=postgresql://agentics:${POSTGRES_PASSWORD}@postgres:5432/openwebui

      # local RAG/memory
      - CHROMA_HTTP_HOST=chroma
      - CHROMA_HTTP_PORT=8000
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998

      # safe defaults
      - ENABLE_SIGNUP=false
      - ENABLE_ADMIN_EXPORT=true
      - ENABLE_ADMIN_CHAT_ACCESS=true

      # internal tools
      - AGENTICS_TOOLS_URL=http://tools-api:8765
      - AGENTICS_TERMINAL_URL=http://open-terminal:8766
      - PLAYWRIGHT_MCP_URL=http://playwright-mcp:3010
      - BROWSER_SANDBOX_URL=http://browser-vnc:3000
      - N8N_URL=http://n8n:5678

  # =========================================================
  # SAFE TOOL GATEWAY - internal only
  # =========================================================
  tools-api:
    <<: [*secure-defaults, *agent-limits]
    build:
      context: ./tools-api
      dockerfile: Dockerfile
    container_name: agentics-tools-api
    networks:
      - tools_net
      - model_net
      - workflow_net
    volumes:
      - ./agent-workspace:/workspace:rw
    environment:
      - PORT=8765
      - WORKSPACE_DIR=/workspace
      - OLLAMA_BASE_URL=http://ollama:11434
      - PLAYWRIGHT_MCP_URL=http://playwright-mcp:3010
      - N8N_URL=http://n8n:5678
      - ALLOW_DESTRUCTIVE=false
      - MAX_COMMAND_TIMEOUT=30
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # =========================================================
  # TERMINAL API - internal only, workspace-only execution
  # =========================================================
  open-terminal:
    <<: [*secure-defaults, *agent-limits]
    build:
      context: ./open-terminal
      dockerfile: Dockerfile
    container_name: agentics-open-terminal
    networks:
      - tools_net
    volumes:
      - open_terminal_data:/data
      - ./agent-workspace:/workspace:rw
    environment:
      - PORT=8766
      - WORKSPACE_DIR=/workspace
      - ALLOW_EXEC=true
      - ALLOW_HOST_MOUNT=false
      - MAX_COMMAND_TIMEOUT=30
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  # =========================================================
  # PYTHON SANDBOX - internal only
  # =========================================================
  python-sandbox:
    <<: [*secure-defaults, *agent-limits]
    image: python:3.12-slim
    container_name: agentics-python-sandbox
    networks:
      - tools_net
    working_dir: /workspace
    volumes:
      - python_sandbox_data:/home/python
      - ./agent-workspace:/workspace:rw
    command: >
      sh -c "pip install --no-cache-dir requests pandas numpy matplotlib rich fastapi uvicorn &&
             python -m http.server 8899 --bind 0.0.0.0"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/python/.cache

  # =========================================================
  # PLAYWRIGHT MCP - internal only
  # =========================================================
  playwright-mcp:
    <<: *secure-defaults
    image: mcr.microsoft.com/playwright/mcp
    container_name: agentics-playwright-mcp
    networks:
      - tools_net
    volumes:
      - ./agent-workspace:/workspace:rw
    command:
      - "--port"
      - "3010"
      - "--host"
      - "0.0.0.0"
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: "2gb"

  # =========================================================
  # HEADFUL BROWSER SANDBOX - localhost noVNC only
  # =========================================================
  browser-vnc:
    <<: *secure-defaults
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: agentics-browser-vnc
    networks:
      - tools_net
    ports:
      - "127.0.0.1:${BROWSER_VNC_PORT:-6080}:3000"
    volumes:
      - browser_profile_data:/config
      - ./agent-workspace:/workspace:rw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - TITLE=Agentics Browser Sandbox
    security_opt:
      - no-new-privileges:true
    shm_size: "2gb"
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512

  # =========================================================
  # WORKFLOWS - localhost only
  # =========================================================
  n8n:
    <<: *secure-defaults
    image: n8nio/n8n:latest
    container_name: agentics-n8n
    depends_on:
      - postgres
    networks:
      - frontend_net
      - workflow_net
      - tools_net
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./agent-workspace:/workspace:rw
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:${N8N_PORT:-5678}
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=openwebui
      - DB_POSTGRESDB_USER=agentics
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

  # =========================================================
  # OBJECT STORE - internal only by default
  # =========================================================
  minio:
    <<: *secure-defaults
    image: minio/minio:latest
    container_name: agentics-minio
    networks:
      - memory_net
    volumes:
      - minio_data:/data
    secrets:
      - minio_root_password
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-agentics}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
    command: server /data --console-address ":9001"

  # =========================================================
  # MONITORING - localhost Grafana only
  # =========================================================
  prometheus:
    <<: *secure-defaults
    image: prom/prometheus:latest
    container_name: agentics-prometheus
    networks:
      - monitoring_net
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  loki:
    <<: *secure-defaults
    image: grafana/loki:latest
    container_name: agentics-loki
    networks:
      - monitoring_net
    volumes:
      - loki_data:/loki

  grafana:
    <<: *secure-defaults
    image: grafana/grafana:latest
    container_name: agentics-grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend_net
      - monitoring_net
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false

  # =========================================================
  # OPTIONAL PHONE/VPN ACCESS
  # Start with: docker compose --profile vpn up -d tailscale
  # =========================================================
  tailscale:
    <<: *secure-defaults
    image: tailscale/tailscale:latest
    container_name: agentics-tailscale
    profiles:
      - vpn
    networks:
      - frontend_net
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=agentics
