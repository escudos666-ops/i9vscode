apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus-metrics:9090
    access: proxy
    isDefault: true

  - name: Loki
    type: loki
    url: http://loki-logs:3100
    access: proxy
    jsonData:
      maxLines: 1000

  - name: OpenSearch
    type: elasticsearch
    url: http://opensearch-fulltext:9200
    access: proxy
    jsonData:
      esVersion: "7.10.0"
      logMessageField: message
      timeField: "@timestamp"
