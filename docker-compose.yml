name: ai-llm-stack

services:
  # ============================================================================
  # CORE SERVICES
  # ============================================================================

  postgres:
    image: docker.io/postgres:16-alpine
    container_name: postgres-service
    restart: unless-stopped
    init: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
      POSTGRES_USER: ${POSTGRES_USER:-webui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-postgres-password-change-this-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    networks:
      - ai-network
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-webui} -d $${POSTGRES_DB:-openwebui}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    init: true
    ports:
      - "11435:11434"
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-16}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-network
    cpus: "6.0"
    mem_limit: 12g
    mem_reservation: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: webui-service
    restart: unless-stopped
    init: true
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me}
      WEBUI_JWT_SECRET: ${WEBUI_JWT_SECRET:-change-me}
      ENABLE_RAG: ${ENABLE_RAG:-true}
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE:-ollama}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_OLLAMA_BASE_URL: ${RAG_OLLAMA_BASE_URL:-http://ollama:11434}
      ENABLE_IMAGE_GENERATION: ${ENABLE_IMAGE_GENERATION:-true}
      ENABLE_FUNCTION_CALLING: ${ENABLE_FUNCTION_CALLING:-true}
      MAX_CONTEXT_LENGTH: ${MAX_CONTEXT_LENGTH:-4096}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-365}
      WEBUI_DEBUG: ${WEBUI_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
    volumes:
      - webui_data:/app/backend/data
    networks:
      - ai-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    cpus: "4.0"
    mem_limit: 6g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================================
  # OPTIONAL: EDGE PROXY
  # ============================================================================

  nginx:
    image: docker.io/nginx:1.27-alpine
    container_name: open-webui-proxy
    profiles: ["edge"]
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/open-webui.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai-network
    depends_on:
      open-webui:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================================================
  # OPTIONAL: CUSTOM APPLICATION SERVICES
  # ============================================================================

  agentic-business-tools:
    build:
      context: ./custom-app/backend
      dockerfile: Dockerfile
    container_name: agentic-business-tools
    profiles: ["tools"]
    restart: unless-stopped
    init: true
    ports:
      - "${AGENTIC_TOOLS_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      OLLAMA_API_BASE_URL: ${OLLAMA_API_BASE_URL:-http://ollama:11434/api}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
      POSTNL_API_KEY: ${POSTNL_API_KEY:-}
      POSTNL_CUSTOMER_CODE: ${POSTNL_CUSTOMER_CODE:-}
      DHL_EXPRESS_API_KEY: ${DHL_EXPRESS_API_KEY:-}
      DHL_EXPRESS_ACCOUNT_NUMBER: ${DHL_EXPRESS_ACCOUNT_NUMBER:-}
      FEDEX_CLIENT_ID: ${FEDEX_CLIENT_ID:-}
      FEDEX_CLIENT_SECRET: ${FEDEX_CLIENT_SECRET:-}
      FEDEX_ACCOUNT_NUMBER: ${FEDEX_ACCOUNT_NUMBER:-}
      SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN:-}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      ENREACH_CLIENT_ID: ${ENREACH_CLIENT_ID:-}
      ENREACH_CLIENT_SECRET: ${ENREACH_CLIENT_SECRET:-}
    networks:
      - ai-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    cpus: "2.0"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', (r) => {if (r.statusCode !== 200) process.exit(1)}).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  playwright-mcp:
    build:
      context: ./openwebui-browser-automator
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_PYTHON_IMAGE: ${PLAYWRIGHT_PYTHON_IMAGE:-mcr.microsoft.com/playwright/python:v1.49.1-jammy}
    container_name: playwright-mcp
    profiles: ["tools"]
    restart: unless-stopped
    init: true
    ports:
      - "8788:8788"
    environment:
      AUTOMATOR_API_TOKEN: ${PLAYWRIGHT_MCP_API_KEY:-change-me-token}
      AUTOMATOR_ALLOWED_HOSTS: localhost,127.0.0.1,open-webui,host.docker.internal
      AUTOMATOR_HEADLESS: "true"
    networks:
      - ai-network
    depends_on:
      open-webui:
        condition: service_healthy
    cpus: "2.0"
    mem_limit: 1g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8788/health')\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  # ============================================================================
  # OPTIONAL: DEVELOPMENT SANDBOX
  # ============================================================================

  gordon-sandbox:
    image: docker.io/docker:27-cli
    container_name: gordon-sandbox
    profiles: ["gordon"]
    restart: unless-stopped
    init: true
    working_dir: /workspace
    command: ["sh", "-lc", "apk add --no-cache bash && tail -f /dev/null"]
    environment:
      GORDON_YOLO_MODE: "true"
      GORDON_WORKSPACE: /workspace
      GORDON_TASKS: /tasks
      GORDON_LOGS: /logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gordon_workspace:/workspace
      - ./gordon_tasks:/tasks
      - ./gordon_logs:/logs
    networks:
      - ai-network
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

# ============================================================================
# PERSISTENT VOLUMES
# ============================================================================

volumes:
  ollama_data:
    name: ai-llm_ollama_data
    driver: local
  webui_data:
    name: ai-llm_webui_data
    driver: local
  postgres_data:
    name: ai-llm_postgres_data
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  ai-network:
    driver: bridge
